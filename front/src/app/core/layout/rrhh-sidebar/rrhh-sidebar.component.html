<aside class="sidebar brand-sidebar flex flex-col h-full text-white">
  <div class="sidebar-brand p-5">
    <div class="flex items-center gap-3">
      <div class="sidebar-logo">
        <i class="pi pi-directions"></i>
      </div>
      <div class="sidebar-brand-text">
        <p class="sidebar-eyebrow">CTA Arequipa</p>
        <p class="sidebar-title">Corredor Azul</p>
      </div>
    </div>
  </div>

  <div class="px-5 pb-3">
    <div class="sidebar-user">
      <div class="sidebar-user-avatar">{{ userInitials() }}</div>
      <div class="min-w-0">
        <p class="text-xs font-semibold text-white/50 uppercase tracking-wider">RRHH</p>
        <p class="text-sm font-semibold truncate">{{ authService.currentUser()?.nombre }}</p>
      </div>
    </div>
  </div>

  <nav class="flex-1 px-3 overflow-y-auto">
    <p class="nav-section-label">Menú principal</p>
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-link"
      >
        <span class="nav-icon"><i [class]="item.icon"></i></span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer p-4">
    <p class="text-[10px] font-semibold uppercase tracking-widest text-white/30">v1.0</p>
  </div>
</aside>

<header class="header flex items-center justify-between px-6 py-3.5 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/60 dark:border-slate-700/60">
  <div class="flex items-center gap-3 min-w-0">
    <div class="user-avatar lg:hidden">
      <i class="pi pi-directions text-sm"></i>
    </div>
    <div class="min-w-0 hidden lg:block">
      <p class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
        Panel de gestión
      </p>
      <p class="text-sm font-bold text-slate-800 dark:text-slate-100 truncate">
        {{ authService.currentUser()?.nombre }}
      </p>
    </div>
  </div>

  <div class="flex items-center gap-2 sm:gap-3">
    <div
      class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200/60 dark:border-slate-700/60"
      title="Modo oscuro"
    >
      <i
        class="pi text-xs text-slate-500"
        [class.pi-moon]="!themeService.isDarkMode()"
        [class.pi-sun]="themeService.isDarkMode()"
      ></i>
      <p-toggleswitch
        [ngModel]="themeService.isDarkMode()"
        (ngModelChange)="onDarkModeChange($event)"
      />
    </div>

    <div class="flex items-center gap-2.5 pl-2 sm:pl-3 sm:border-l border-slate-200/60 dark:border-slate-700/60">
      <div class="user-avatar hidden sm:flex">
        {{ userInitials() }}
      </div>
      <div class="hidden md:block min-w-0">
        <p class="text-sm font-semibold text-slate-800 dark:text-slate-100 truncate max-w-[160px]">
          {{ authService.currentUser()?.nombre }}
        </p>
        <p class="text-xs text-slate-500 truncate max-w-[160px]">
          {{ authService.currentUser()?.email }}
        </p>
      </div>
      <p-button
        icon="pi pi-sign-out"
        severity="secondary"
        [rounded]="true"
        [text]="true"
        pTooltip="Cerrar sesión"
        (onClick)="logout()"
      />
    </div>
  </div>
</header>

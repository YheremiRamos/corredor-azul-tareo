<div class="space-y-6">

  <h1 class="text-2xl font-semibold text-slate-800 dark:text-slate-100">Períodos</h1>



  <p-card class="rounded-xl shadow-sm border">

    <div class="flex flex-wrap items-end gap-4">

      <div>

        <label class="block text-sm text-slate-600 dark:text-slate-300 mb-1">Año</label>

        <p-inputnumber [ngModel]="anio()" (ngModelChange)="anio.set($event)" [min]="2020" [max]="2100" [useGrouping]="false" />

      </div>

      <div>

        <label class="block text-sm text-slate-600 dark:text-slate-300 mb-1">Mes de referencia</label>

        <p-inputnumber [ngModel]="mes()" (ngModelChange)="mes.set($event)" [min]="1" [max]="12" [useGrouping]="false" />

      </div>

      <p-button

        label="Crear período"

        icon="pi pi-plus"

        [loading]="creando()"

        (onClick)="crearPeriodo()"

      />

    </div>

    <p class="text-sm text-slate-500 mt-3">

      El ciclo va del día 22 del mes anterior al 21 del mes indicado.

    </p>

  </p-card>



  <p-card class="rounded-xl shadow-sm border">

    <p-table [value]="periodosResource.value() ?? []" [loading]="periodosResource.isLoading()">

      <ng-template #header>

        <tr><th>Nombre</th><th>Estado</th></tr>

      </ng-template>

      <ng-template #body let-periodo>

        <tr><td>{{ periodo.nombre }}</td><td>{{ periodo.estado }}</td></tr>

      </ng-template>

    </p-table>

  </p-card>

</div>

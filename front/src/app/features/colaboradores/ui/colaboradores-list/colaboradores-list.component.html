<div class="space-y-6">
  <h1 class="text-2xl font-semibold text-slate-800 dark:text-slate-100">Colaboradores</h1>
  <p-card class="rounded-xl shadow-sm border">
    <p-table [value]="colaboradoresResource.value() ?? []" [loading]="colaboradoresResource.isLoading()">
      <ng-template #header>
        <tr><th>DNI</th><th>Nombre</th></tr>
      </ng-template>
      <ng-template #body let-colaborador>
        <tr><td>{{ colaborador.dni }}</td><td>{{ colaborador.nombre }}</td></tr>
      </ng-template>
    </p-table>
  </p-card>
</div>

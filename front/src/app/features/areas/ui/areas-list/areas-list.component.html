<div class="space-y-6">
  <h1 class="text-2xl font-semibold text-slate-800 dark:text-slate-100">Áreas</h1>
  <p-card class="rounded-xl shadow-sm border">
    <p-table [value]="areasResource.value() ?? []" [loading]="areasResource.isLoading()">
      <ng-template #header>
        <tr><th>Nombre</th></tr>
      </ng-template>
      <ng-template #body let-area>
        <tr><td>{{ area.nombre }}</td></tr>
      </ng-template>
    </p-table>
  </p-card>
</div>

<div class="space-y-6">
  <h1 class="text-2xl font-semibold text-slate-800 dark:text-slate-100">Seguimiento</h1>
  <p-card class="rounded-xl shadow-sm border p-5">
    @if (seguimientoResource.isLoading()) {
      <p class="text-slate-500">Cargando seguimiento...</p>
    } @else {
      <ul class="space-y-2">
        @for (item of seguimientoResource.value() ?? []; track item.id) {
          <li class="text-slate-700 dark:text-slate-300">{{ item.descripcion }}</li>
        } @empty {
          <li class="text-slate-500">Sin datos de seguimiento</li>
        }
      </ul>
    }
  </p-card>
</div>

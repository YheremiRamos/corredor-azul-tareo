<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold text-slate-800 dark:text-slate-100">Tareo</h1>
      <p class="text-sm text-slate-500">Matriz de asistencia por período</p>
    </div>

    <p-select
      [options]="estados"
      optionLabel="label"
      optionValue="value"
      placeholder="Filtrar por estado"
      (onChange)="estadoFiltro.set($event.value)"
      class="w-48"
    />
  </div>

  <p-card class="rounded-xl shadow-sm border">
    @if (tareoResource.isLoading()) {
      <p class="text-slate-500">Cargando tareos...</p>
    } @else {
      <p-table [value]="tareosFiltrados()" [tableStyle]="{ 'min-width': '40rem' }">
        <ng-template #header>
          <tr>
            <th>ID</th>
            <th>Período</th>
            <th>Área</th>
            <th>Estado</th>
          </tr>
        </ng-template>
        <ng-template #body let-tareo>
          <tr>
            <td>{{ tareo.id }}</td>
            <td>{{ tareo.periodoId }}</td>
            <td>{{ tareo.areaId }}</td>
            <td>{{ tareo.estado }}</td>
          </tr>
        </ng-template>
        <ng-template #emptymessage>
          <tr>
            <td colspan="4" class="text-center text-slate-500 py-6">Sin registros de tareo</td>
          </tr>
        </ng-template>
      </p-table>
    }
  </p-card>
</div>
